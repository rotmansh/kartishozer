name: Phase 1 preview (GitHub Pages)

# Deployed the Phase 1 static mock-data build to GitHub Pages. Frozen
# on purpose as of Phase 2: the app is now a real, per-user, database-
# backed Next.js app (real auth, real listings/orders) that cannot be
# meaningfully static-exported — there is no server to check who's
# signed in or query the database once it's just static files. Phase 2
# is previewed on Vercel instead. This workflow is kept, disarmed
# (manual-only), purely so the live Phase 1 snapshot already published
# at this Pages URL is never overwritten by an later, incompatible
# build. Do not re-add a push trigger without re-checking that
# assumption.

on:
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: kartishozer-web/package-lock.json

      - name: Install dependencies
        working-directory: kartishozer-web
        run: npm ci

      - name: Build static export
        working-directory: kartishozer-web
        run: npm run build
        env:
          GITHUB_PAGES: "true"

      - name: Add .nojekyll
        run: touch kartishozer-web/out/.nojekyll

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: kartishozer-web/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # No `environment:` block here on purpose: GitHub's auto-created
    # "github-pages" environment defaults to a branch protection rule
    # that only allows deploys from the default branch, which silently
    # blocks this preview branch. deploy-pages works fine without it.
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
