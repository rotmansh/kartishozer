name: Rescue Five APK

# Builds the חמישיית ההצלה game (wonder-kids/) into a debug Android APK
# and attaches it to the workflow run as a downloadable artifact.

on:
  push:
    paths:
      - 'wonder-kids/**'
      - '.github/workflows/rescue-five-apk.yml'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: rescue-five-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: wonder-kids
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: wonder-kids/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm ci

      - name: Copy the game into the Android project
        run: npx cap sync android

      - name: Build debug APK
        working-directory: wonder-kids/android
        run: ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: rescue-five-apk
          path: wonder-kids/android/app/build/outputs/apk/debug/app-debug.apk
